<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        .form-control {
            width: 400px;
        }

        .form-select {
            width: 400px;
        }
    </style>
</head>
<body>
    <div class="container pt-20">
    <form class="row g-3 bg-dark text-light">
  <div class="col-md-12">
    <label for="inputEmail4" class="form-label">Full Name</label>
    <input type="email" class="form-control" id="inputEmail4" required>
  </div>

  <div class="col-12">
    <label for="inputAddress" class="form-label"> Email</label>
    <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St" required>
  </div>
  <div class="col-12">
    <label for="inputAddress" class="form-label"> phone Number</label>
    <input type="number" class="form-control" id="inputAddress" required>
  </div>

  <div class="col-12">
    <label for="dob" class="form-label"> Date Of Birth</label>
    <input type="date" class="form-control" id="dob" required>
    <div id="ageMessage" class="mt-2"></div>
  </div>
  
  
  <div class="col-md-12">
    <label for="Country" class="form-label">Country</label>
    <select id="Country" class="form-select" required>
      <option value="" selected> select country</option>
  
    </select>
  </div>

  <div class="col-md-12">
    <label for="State" class="form-label">State</label>
    <select id="state" class="form-select" required>
      <option value="" selected> select state</option>
    </select>
  </div>

  <div class="col-md-12">
    <label for="lga" class="form-label">Local government</label>
    <select id="lga" class="form-select" required>
      <option value="" selected>select local government</option>
  
    </select>
  </div>

   <div class="col-md-12">
    <label for="password" class="form-label">Password</label>
    <input type="password" class="form-control" id="password">
    <div id="passwordMessage" class="mt-2"></div>
  </div>

   <div class="col-md-12">
    <label for="ConfirmPassword" class="form-label"> Confirm Password</label>
    <input type="password" class="form-control" id="confirmPassword" required>
    <div id="confirmPasswordMessage" class="mt-2"></div>
  </div>

  <div class="col-12">
    <div class="form-check">
      <label class="form-label" >
        Check me out
      </label>
      <input class="form-check-input" type="checkbox" id="gridCheck">
      
    </div>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Sign in</button>
  </div>
</form> 
</div>


<script src="index.js"></script>
</body>
</html>
